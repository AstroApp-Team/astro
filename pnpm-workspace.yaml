allowBuilds:
  # workerd is the Cloudflare Workers runtime binary — required by
  # @cloudflare/vite-plugin for dev/preview and by the Workers test project.
  workerd: true
  esbuild: true

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.1
  vite-plus: 1.5.1

  # Vitest must match the version bundled inside vite-plus exactly, or
  # @cloudflare/vitest-plugin resolves two copies and fails. `vp migrate`
  # re-pins both entries when vite-plus moves.
  vitest: 5.1.0
  "@vitest/snapshot": 5.1.0

  react: 19.2.8
  react-dom: 19.2.8
  "@types/react": 19.2.7
  "@types/react-dom": 19.2.3

overrides:
  "@vitest/snapshot": "catalog:"
  vite@*: "catalog:"
  vitest@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
